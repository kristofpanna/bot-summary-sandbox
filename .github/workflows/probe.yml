name: probe

# Round 3: post a red-panda-shaped summary (markers + run record + one inline finding), then run the
# real stub script, exactly as claude-review.yml will.
on:
  pull_request:
    types: [synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      PR: ${{ github.event.pull_request.number }}
      SHA: ${{ github.event.pull_request.head.sha }}
      REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - name: Post a marker-carrying summary with one inline finding
        run: |
          jq -n --arg sha "$SHA" '{commit_id:$sha, event:"COMMENT",
            body:("🐼 Full summary at " + $sha[0:7] + "\n\n<!-- claude-inline-review -->\n<!-- ai-review-run {\"sha\":\"" + $sha[0:7] + "\",\"findings\":1} -->"),
            comments:[{path:"probe.txt", line:2, side:"RIGHT", body:("🐼 marker finding at " + $sha[0:7])}]}' \
            | gh api "repos/$REPO/pulls/$PR/reviews" -X POST --input - --jq '{id, html_url}'
      - name: Collapse superseded summaries
        run: bash scripts/stub_superseded_summaries.sh "$REPO" "$PR" '<!-- claude-inline-review -->' '🐼'
